<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Two interlocking chain links: the orange one passes over the green one
       at the top crossing and under it at the bottom -->
  <defs>
    <rect id="a" x="1.5" y="10.5" width="19" height="11" rx="5.5" fill="none" stroke="#ff5d00" stroke-width="3.5"/>
    <clipPath id="top"><rect x="8" y="4" width="14" height="9.5"/></clipPath>
  </defs>
  <g transform="rotate(-35 16 16)">
    <use href="#a"/>
    <rect x="11.5" y="10.5" width="19" height="11" rx="5.5" fill="none" stroke="#3dff19" stroke-width="3.5"/>
    <use href="#a" clip-path="url(#top)"/>
  </g>
</svg>
